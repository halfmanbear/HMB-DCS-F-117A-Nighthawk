name: Package mod

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate branch or release tag
        id: channel
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            git -C mod merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Stable release tags must point to a commit on main.' }
            $channel = 'main'
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_NAME -in @('dev', 'main')) {
            $channel = $env:GITHUB_REF_NAME
            $tag = ''
          } else {
            throw 'Packaging is supported only from dev, main, or a stable version tag.'
          }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Read entry.lua version and validate tag
        id: metadata
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          $arguments = @('mod/tools/package_release.py', 'metadata', '--channel', $env:CHANNEL)
          if ($env:RELEASE_TAG) { $arguments += @('--tag', $env:RELEASE_TAG) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Invalid version metadata.' }

      - name: Check out matching EFM branch
        uses: actions/checkout@v4
        with:
          repository: halfmanbear/HMB-DCS-F-117A-EFM
          ref: ${{ steps.channel.outputs.channel }}
          path: efm
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v2

      - name: Build real Release x64 EFM in isolation
        working-directory: efm/EFM Source Code
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'efm-package-build'
          $outputDir = Join-Path $buildRoot 'bin/'
          $objectDir = Join-Path $buildRoot 'obj/'
          $targets = Join-Path $env:GITHUB_WORKSPACE 'mod/.github/packaging/Release.targets'
          msbuild F_117_NightHawk.vcxproj /t:Rebuild /m /verbosity:minimal `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 `
            "/p:OutDir=$outputDir" "/p:IntDir=$objectDir" `
            "/p:DcsSavedGamesModBinDir=$outputDir" `
            "/p:ForceImportAfterCppTargets=$targets"
          if ($LASTEXITCODE -ne 0) { throw 'EFM build failed; no proxy or old binary will be used.' }
          if (!(Test-Path (Join-Path $outputDir 'F_117_NightHawk.dll'))) { throw 'Built DLL is missing.' }

      - name: Test packager
        run: python -m unittest discover -s mod/tests/packaging -v

      - name: Assemble clean mod ZIP
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          $arguments = @('mod/tools/package_release.py', 'package', '--channel', $env:CHANNEL,
            '--efm-root', 'efm', '--dll', (Join-Path $env:RUNNER_TEMP 'efm-package-build/bin/F_117_NightHawk.dll'),
            '--output', 'dist')
          if ($env:RELEASE_TAG) { $arguments += @('--tag', $env:RELEASE_TAG) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed.' }

      - name: Save installable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: F-117-Nighthawk-${{ steps.metadata.outputs.version }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: F-117-Nighthawk-${{ needs.package.outputs.version }}
          path: dist

      - name: Publish stable release or dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          CHANNEL: ${{ needs.package.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == dev ]]; then
            tag="dev-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "F-117A ${VERSION}" --prerelease --latest=false \
              --notes 'Development build. Matching dev EFM source was built as Release x64. See the packaged build-manifest.json for both commits and DLL checksum.'
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "F-117A ${VERSION}" \
              --notes 'Runtime package with the matching main EFM source built as Release x64. See the packaged build-manifest.json for both commits and DLL checksum.'
          fi
